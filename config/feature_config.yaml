# Feature Engineering & Preprocessing Configuration

structural_missing_imputations:
  # Categoricals where NA represents "None / Absence of amenity"
  categorical_none:
    - "PoolQC"
    - "MiscFeature"
    - "Alley"
    - "Fence"
    - "FireplaceQu"
    - "GarageQual"
    - "GarageCond"
    - "GarageFinish"
    - "GarageType"
    - "BsmtExposure"
    - "BsmtFinType2"
    - "BsmtCond"
    - "BsmtQual"
    - "BsmtFinType1"
    - "MasVnrType"
  # Numerics where NA indicates zero quantity
  numeric_zero:
    - "GarageCars"
    - "GarageArea"
    - "TotalBsmtSF"
    - "BsmtFinSF1"
    - "BsmtFinSF2"
    - "BsmtUnfSF"
    - "BsmtFullBath"
    - "BsmtHalfBath"
    - "MasVnrArea"

engineered_features:
  - name: "TotalSF"
    formula: "GrLivArea + TotalBsmtSF"
    description: "Total square footage including finished above grade and basement"
  - name: "TotalBath"
    formula: "FullBath + 0.5 * HalfBath + BsmtFullBath + 0.5 * BsmtHalfBath"
    description: "Total fractional bathrooms in the property"
  - name: "TotalPorchSF"
    formula: "OpenPorchSF + EnclosedPorch + 3SsnPorch + ScreenPorch"
    description: "Total combined outdoor living and porch area"
  - name: "HouseAgeAtSale"
    formula: "YrSold - YearBuilt"
    description: "Age of property at the exact year of historical sale"
  - name: "RemodAgeAtSale"
    formula: "YrSold - YearRemodAdd"
    description: "Years since last remodel/addition at the exact year of sale"
  - name: "IsRemodeled"
    formula: "(YearRemodAdd != YearBuilt).astype(int)"
    description: "Binary flag indicating whether property had a remodel or addition"
  - name: "OverallGradeScore"
    formula: "OverallQual * OverallCond"
    description: "Interaction between overall quality rating and condition rating"

exclude_columns:
  - "Order"
  - "PID"
  - "SalePrice"
